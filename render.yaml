# Render Blueprint — serves the generated site (docs/) as a free static site.
# The pages are built and committed by the GitHub Actions workflow; Render just
# publishes the folder and redeploys on every commit to main.
# Set up once: Render Dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: daily-dose-site
    runtime: static
    buildCommand: echo "Nothing to build - pages are generated by GitHub Actions"
    staticPublishPath: ./docs
    envVars:
      # Render otherwise sees requirements.txt and installs Python + every
      # package on each deploy — slow, and a failed install would block it.
      - key: SKIP_INSTALL_DEPS
        value: "true"
