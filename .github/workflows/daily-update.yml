name: Daily Dose of DS — Auto Update

on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST daily
  workflow_dispatch:
    inputs:
      first_run:
        description: "Process ALL historical emails (first-time setup)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail token
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          if [ -n "$GMAIL_TOKEN" ]; then
            echo "$GMAIL_TOKEN" > token.json
            echo "✅ token.json written"
          else
            echo "⚠️  GMAIL_TOKEN secret not set"
          fi

      - name: Build site
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.first_run }}" = "true" ]; then
            echo "🕐 First-run mode — processing ALL historical emails..."
            python build_site.py --first-run
          else
            echo "📅 Daily mode — processing new emails..."
            python build_site.py --daily
          fi

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          # IMPORTANT: site_data.db must be committed alongside docs/ so the
          # roadmap's full history persists across every automated run.
          git add docs/ site_data.db
          git diff --staged --quiet || git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M') [v8]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Safety net ────────────────────────────────────────────────────────
      # If "Build site" or "Commit and push" fails (e.g. the Gmail OAuth
      # refresh token expired again), don't fail silently for a month like
      # last time — open/update a GitHub issue immediately so it's visible
      # in your notifications the same day.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Daily auto-update failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled build on **${new Date().toISOString().slice(0,10)}** failed.`,
              "",
              `View the failed run: ${runUrl}`,
              "",
              "Common cause: the Gmail OAuth refresh token (`GMAIL_TOKEN` secret) has expired — this happens automatically every ~7 days if the Google Cloud OAuth consent screen is still in \"Testing\" status. Publish the app to Production, regenerate `token.json` locally, and update the `GMAIL_TOKEN` secret.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-update-failure",
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Failed again — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auto-update-failure"],
              });
            }

      - name: Close stale failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-update-failure",
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Build succeeded again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }