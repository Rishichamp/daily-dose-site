name: Daily Dose of DS — Auto Update

on:
  schedule:
    # Two runs a day, at odd minutes (GitHub delays jobs queued on the hour).
    # The second run is a safety net if the morning one hits a transient error.
    - cron: "23 1 * * *"    # ~6:53 AM IST
    - cron: "47 13 * * *"   # ~7:17 PM IST
  workflow_dispatch:
    inputs:
      first_run:
        description: "Process the whole newsletter history (first-time setup)"
        required: false
        default: false
        type: boolean
      repair:
        description: "Repair only: restore titles, recompute categories, renumber by date, regenerate every page (no fetching)"
        required: false
        default: false
        type: boolean
      source:
        description: "Where new issues come from"
        required: false
        default: "feed"
        type: choice
        options:
          - feed    # public Substack archive — no login, nothing expires
          - auto    # Gmail, falling back to the feed
          - gmail   # Gmail only (needs a fresh GMAIL_TOKEN secret)

permissions:
  contents: write
  issues: write
  actions: write   # lets the keep-alive step stop GitHub disabling the schedule

# Never let two runs edit site_data.db at the same time.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DDS_SOURCE: ${{ github.event.inputs.source || 'feed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only needed for the optional Gmail source. The default feed source
      # needs no credentials, so an expired Gmail token can't stop the site.
      - name: Write Gmail token
        if: env.DDS_SOURCE != 'feed'
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          if [ -n "$GMAIL_TOKEN" ]; then
            echo "$GMAIL_TOKEN" > token.json
            echo "✅ token.json written"
          else
            echo "⚠️  GMAIL_TOKEN secret not set"
          fi

      - name: Build site
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.repair }}" = "true" ]; then
            echo "🔧 Repair mode — fixing titles, categories and numbering, regenerating pages..."
            python build_site.py --repair
          elif [ "${{ github.event.inputs.first_run }}" = "true" ]; then
            echo "🕐 First-run mode — processing the whole newsletter history..."
            python build_site.py --first-run
          else
            echo "📅 Daily mode — processing new issues..."
            python build_site.py --daily
          fi

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          # IMPORTANT: site_data.db must be committed alongside docs/ so the
          # roadmap's full history persists across every automated run.
          git add docs/ site_data.db
          git diff --staged --quiet && { echo "Nothing to commit."; exit 0; }
          git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M') [v8]"
          # If main moved while this run was building, replay on top and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt) — rebasing on origin/main..."
            git pull --rebase origin main
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows in a repo with no activity for 60
      # days. Re-enabling the workflow on every run keeps the schedule alive.
      - name: Keep the schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-update.yml/enable"

      # ── Safety net ────────────────────────────────────────────────────────
      # If "Build site" or "Commit and push" fails, open/update a GitHub issue
      # immediately so it's visible in your notifications the same day.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "🚨 Daily auto-update failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled build on **${new Date().toISOString().slice(0,10)}** failed.`,
              "",
              `View the failed run: ${runUrl}`,
              "",
              "Things to check, in order:",
              "1. **No new issue for 14+ days** — the newsletter's public archive (https://blog.dailydoseofds.com) may have moved or changed format. The run log says which.",
              "2. **Network/API error** — usually transient; the next scheduled run (twice a day) retries automatically.",
              "3. **Gemini** — an invalid `GEMINI_API_KEY` doesn't fail the run (chapters fall back to a non-AI summary), but check the log for `AI disabled`.",
              "4. **Gmail source** (only if run with source = gmail/auto) — the `GMAIL_TOKEN` secret expires every 7 days while the Google OAuth app is in Testing mode.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-update-failure",
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Failed again — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auto-update-failure"],
              });
            }

      - name: Close stale failure issue on success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auto-update-failure",
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Build succeeded again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
